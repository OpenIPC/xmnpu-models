# Fine-tunes a COCO YOLOv8 for the NPU -- LeakyReLU in place of SiLU, the
# camera's eight classes -- or trains pvdn (person and vehicle, from scratch;
# train/pvdn.yaml) on the self-hosted GPU runner, and publishes the checkpoint
# as a release for release.yml to compile. Run by hand only, like
# release.yml: a checkpoint is never uploaded from a workstation.
#
# mode "import" publishes a fine-tune already run on the runner's host (its
# run directory), after evaluating it here, instead of training another.
name: train

on:
  workflow_dispatch:
    inputs:
      mode:
        description: train, or import an existing run
        type: choice
        options: [train, import]
        default: train
      model:
        description: COCO model to start from, or pvdn (from scratch)
        type: choice
        options: [yolov8n, yolov8s, pvdn]
        default: yolov8s
      epochs:
        description: Epochs (train; a fine-tune takes about 60, pvdn from scratch about 300)
        default: "60"
      batch:
        description: Batch size (train)
        default: "64"
      run_dir:
        description: Run directory on the runner's host (import)
        default: ""
      tag:
        description: Release tag to create (e.g. yolov8s-lrelu-c8-v1). Must not exist yet.
        required: true

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: [self-hosted, spark, gpu]
    timeout-minutes: 4320
    env:
      COCO_DIR: /home/dima/datasets/coco
      TRAIN_WORK: /home/dima/xmnpu-train
    steps:
      - uses: actions/checkout@v4

      # Into the host's TRAIN_WORK rather than the workspace: the publish job
      # below checks out afresh, which cleans the workspace.
      - name: Fine-tune or import
        env:
          MODE: ${{ inputs.mode }}
          MODEL: ${{ inputs.model }}
          EPOCHS: ${{ inputs.epochs }}
          BATCH: ${{ inputs.batch }}
          RUN_DIR: ${{ inputs.run_dir }}
          OUT: ${{ env.TRAIN_WORK }}/out/${{ github.run_id }}
        run: |
          rm -rf "$OUT"
          if [ "$MODE" = import ]; then
            bash train/run.sh import "$MODEL" "$RUN_DIR" "$OUT"
          else
            bash train/run.sh train "$MODEL" "$EPOCHS" "$BATCH" "$OUT"
          fi

  # A job of its own, for its own token. A job's GITHUB_TOKEN lasts 24 hours,
  # and pvdn from scratch trains for longer: pvdn-v1's training job reached
  # this step after 37 hours, its release request was refused, and the run had
  # to be imported to be published.
  #
  # It reads the training job's output from the host, so it has to run on the
  # same one: these labels name a single runner, the Spark. A second runner
  # with them would need the output carried as an artifact instead, and the
  # check below says so rather than publishing an empty release.
  publish:
    needs: train
    runs-on: [self-hosted, spark, gpu]
    env:
      OUT: /home/dima/xmnpu-train/out/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [ -f "$OUT/eval.md" ] || { echo "no training output at $OUT on $(hostname): this job ran on another runner than the training job"; exit 1; }
          rm -rf out && ln -s "$OUT" out
          {
            echo "${{ inputs.mode }} of ${{ inputs.model }} by run ${{ github.run_id }} from ${{ github.sha }}."
            echo
            cat out/eval.md
            echo
            if [ "${{ inputs.model }}" != pvdn ]; then
              echo "The reference column is the stock SiLU ${{ inputs.model }} (80 classes) on the same images."
            fi
          } > notes.md
          bash scripts/publish.sh "$TAG" notes.md out/*
