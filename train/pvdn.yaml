# pvdn: a person/vehicle detector for the GK7205V5x0 NPU, 640x352.
#
# The body is the layout of the person/vehicle model the camera vendor ships
# for customer counting -- a slimmed YOLOv5n, read off its compiled graph:
# a stem to 1/4 scale (theirs is one 8x8 stride-4 convolution, which XMTVMC
# cannot take -- its kernels are 1, 3, 5 and 7 -- and a 7x7 stride-4 one never
# finishes in its C-model; YOLOv5's own 6x6/2 then 3x3/2 here), C3 stages of
# 32, 64, 120
# and 232 channels with 1, 2, 3 and 1 bottlenecks, SPPF, and a PAN neck of
# 120 / 64 / 120 / 232. The head is YOLOv8's (DFL boxes, a class map per
# scale), so it trains, compiles, is gated and decodes like the yolov8 models
# here and in majestic. LeakyReLU(0.1), which the NPU fuses into the
# convolution, in place of SiLU, which costs it a pass of its own.

nc: 2 # person, vehicle
activation: nn.LeakyReLU(0.1)
# the repeats and channel counts below are the model's own
depth_multiple: 1.0
width_multiple: 1.0

backbone:
  # [from, number, module, args]
  - [-1, 1, Conv, [16, 6, 2, 2]] # 0-P1/2
  - [-1, 1, Conv, [32, 3, 2]] # 1-P2/4
  - [-1, 1, C3, [32]] # 2
  - [-1, 1, Conv, [64, 3, 2]] # 3-P3/8
  - [-1, 2, C3, [64]] # 4
  - [-1, 1, Conv, [120, 3, 2]] # 5-P4/16
  - [-1, 3, C3, [120]] # 6
  - [-1, 1, Conv, [232, 3, 2]] # 7-P5/32
  - [-1, 1, C3, [232]] # 8
  - [-1, 1, SPPF, [232, 5]] # 9

head:
  - [-1, 1, Conv, [120, 1, 1]] # 10
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 1, C3, [120, False]] # 13

  - [-1, 1, Conv, [64, 1, 1]] # 14
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 1, C3, [64, False]] # 17 (P3/8)

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 1, C3, [120, False]] # 20 (P4/16)

  - [-1, 1, Conv, [120, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3, [232, False]] # 23 (P5/32)

  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P3, P4, P5)
